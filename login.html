<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FFFFFF">

    <title>Login | MichaelVenture</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #F3F4F6;
            color: #1E293B;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* MICHAELVENTURE WATERMARK LOGO */

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: url("logo.png");
            background-repeat: no-repeat;
            background-position: center;
            background-size: 280px;
            opacity: 0.045;
            pointer-events: none;
            z-index: 0;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            position: relative;
            z-index: 1;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.97);
            padding: 35px 28px;
            border-radius: 20px;
            border: 1px solid #E5E7EB;
            box-shadow: 0 10px 35px rgba(15, 23, 42, 0.08);
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            background: #FFFFFF;
            border: 1px solid #E5E7EB;
            border-radius: 20px;
            padding: 6px;
            margin-bottom: 14px;
        }

        .brand h1 {
            font-size: 27px;
            color: #1E293B;
            margin-bottom: 7px;
        }

        .brand p {
            color: #64748B;
            font-size: 14px;
            line-height: 1.6;
        }

        .welcome {
            text-align: center;
            margin-bottom: 25px;
        }

        .welcome h2 {
            font-size: 23px;
            margin-bottom: 8px;
            color: #1E293B;
        }

        .welcome p {
            font-size: 14px;
            color: #64748B;
        }

        .form-group {
            margin-bottom: 19px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
            color: #374151;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #D1D5DB;
            border-radius: 10px;
            font-size: 15px;
            background: #FFFFFF;
            color: #1E293B;
            outline: none;
        }

        .form-group input:focus {
            border-color: #2563EB;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 75px;
        }

        .show-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #2563EB;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
        }

        .forgot-password {
            display: block;
            text-align: right;
            margin-top: -7px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #2563EB;
            text-decoration: none;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: #2563EB;
            color: #FFFFFF;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #1D4ED8;
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .message {
            display: none;
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 9px;
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .message.error {
            display: block;
            background: #FEE2E2;
            color: #991B1B;
        }

        .message.success {
            display: block;
            background: #DBEAFE;
            color: #1D4ED8;
        }

        .register-link {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #64748B;
        }

        .register-link a {
            color: #2563EB;
            text-decoration: none;
            font-weight: bold;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            font-size: 12px;
            color: #64748B;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 28px 20px;
            }

            .brand h1 {
                font-size: 24px;
            }

            .welcome h2 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="brand">
            <img src="logo.png"
                 alt="MichaelVenture Logo"
                 class="logo">

            <h1>MichaelVenture</h1>

            <p>
                Professional Digital Services<br>
                Academic Support &amp; Business Solutions
            </p>
        </div>

        <div class="welcome">
            <h2>Welcome Back!</h2>
            <p>Login to access your MichaelVenture account.</p>
        </div>

        <div id="message" class="message" role="alert"></div>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email address"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        id="togglePassword"
                    >Show</button>
                </div>
            </div>

            <a href="#" class="forgot-password" id="forgotPassword">
                Forgot Password?
            </a>

            <button type="submit" class="login-btn" id="loginBtn">
                Login to Your Account
            </button>

        </form>

        <div class="register-link">
            Don't have an account?
            <a href="register.html">Create Account</a>
        </div>

    </div>

    <div class="footer">
        &copy; <span id="year"></span> MichaelVenture.
        All Rights Reserved.
    </div>

</div>

<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
document.getElementById("year").textContent =
    new Date().getFullYear();

const loginForm = document.getElementById("loginForm");
const loginBtn = document.getElementById("loginBtn");
const messageBox = document.getElementById("message");
const passwordInput = document.getElementById("password");
const togglePassword = document.getElementById("togglePassword");
const forgotPassword = document.getElementById("forgotPassword");

function showMessage(message, type) {
    messageBox.textContent = message;
    messageBox.className = "message " + type;
}

function getSupabaseClient() {
    if (!window.supabase) {
        throw new Error("Supabase library could not load. Check your internet connection.");
    }

    if (!window.SUPABASE_URL || !window.SUPABASE_KEY) {
        throw new Error("Supabase settings were not found in supabase.js.");
    }

    if (!window.mvSupabase) {
        window.mvSupabase = window.supabase.createClient(
            window.SUPABASE_URL,
            window.SUPABASE_KEY
        );
    }

    return window.mvSupabase;
}

togglePassword.addEventListener("click", function () {
    if (passwordInput.type === "password") {
        passwordInput.type = "text";
        togglePassword.textContent = "Hide";
    } else {
        passwordInput.type = "password";
        togglePassword.textContent = "Show";
    }
});

loginForm.addEventListener("submit", async function (event) {
    event.preventDefault();

    loginBtn.disabled = true;
    loginBtn.textContent = "Logging in...";

    try {
        const supabaseClient = getSupabaseClient();

        const email = document.getElementById("email").value.trim();
        const password = passwordInput.value;

        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {
            throw error;
        }

        if (!data.session) {
            throw new Error("Login was not completed. Please try again.");
        }

        showMessage("Login successful! Opening your dashboard...", "success");

        window.location.href = "dashboard.html";

    } catch (error) {
        showMessage(
            error.message || "Login failed. Please check your details.",
            "error"
        );

        loginBtn.disabled = false;
        loginBtn.textContent = "Login to Your Account";
    }
});

forgotPassword.addEventListener("click", async function (event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();

    if (!email) {
        showMessage(
            "Please enter your email address first, then tap Forgot Password.",
            "error"
        );
        document.getElementById("email").focus();
        return;
    }

    try {
        const supabaseClient = getSupabaseClient();

        const { error } = await supabaseClient.auth.resetPasswordForEmail(
            email,
            {
                redirectTo: window.location.origin +
                    window.location.pathname.replace(
                        /[^/]*$/,
                        "reset-password.html"
                    )
            }
        );

        if (error) {
            throw error;
        }

        showMessage(
            "If the account exists, a password reset email will be sent. Check your inbox.",
            "success"
        );

    } catch (error) {
        showMessage(
            error.message || "Could not send the password reset email.",
            "error"
        );
    }
});
</script>

</body>
</html>
