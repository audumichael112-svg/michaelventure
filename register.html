<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0F172A">

    <title>Create Account | MichaelVenture</title>

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: #F8FAFC;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: #172554;
            background: transparent;
            position: relative;
        }

        /* CENTERED BRAND WATERMARK */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: url("./logo.png");
            background-repeat: no-repeat;
            background-position: center center;
            background-size: min(85vw, 600px);
            opacity: 0.09;
            pointer-events: none;
            z-index: 0;
        }

        .register-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }

        /* HEADER */
        .register-header {
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.96);
            border-bottom: 1px solid #DBE4F0;
            text-align: center;
        }

        .register-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .register-brand img {
            width: 55px;
            height: 55px;
            object-fit: contain;
        }

        .register-brand h1 {
            margin: 0;
            color: #0F172A;
            font-size: 23px;
        }

        .register-brand p {
            margin: 4px 0 0;
            color: #64748B;
            font-size: 12px;
        }

        /* MAIN CONTENT */
        .register-main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 35px 16px;
        }

        .register-card {
            width: 100%;
            max-width: 460px;
            padding: 32px;
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid #DBE4F0;
            border-radius: 20px;
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
        }

        .register-logo {
            display: block;
            width: 75px;
            height: 75px;
            object-fit: contain;
            margin: 0 auto 15px;
        }

        .register-card h2 {
            margin: 0 0 8px;
            color: #0F172A;
            font-size: 29px;
            text-align: center;
        }

        .register-description {
            margin: 0 0 26px;
            color: #64748B;
            text-align: center;
            line-height: 1.6;
            font-size: 14px;
        }

        /* FORM */
        .register-form .form-group {
            margin-bottom: 18px;
        }

        .register-form label {
            display: block;
            margin-bottom: 8px;
            color: #172554;
            font-size: 14px;
            font-weight: 700;
        }

        .register-form input {
            display: block;
            width: 100%;
            min-height: 49px;
            padding: 12px 14px;
            border: 1px solid #CBD5E1;
            border-radius: 10px;
            background: #FFFFFF;
            color: #0F172A;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .register-form input::placeholder {
            color: #94A3B8;
        }

        .register-form input:focus {
            border-color: #2563EB;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        /* CREATE ACCOUNT BUTTON */
        .register-submit {
            display: block;
            width: 100%;
            min-height: 50px;
            margin-top: 8px;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #2563EB;
            color: #FFFFFF;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        .register-submit:hover {
            background: #1D4ED8;
            transform: translateY(-1px);
        }

        .register-submit:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        /* LINKS */
        .register-login {
            margin: 23px 0 0;
            color: #64748B;
            text-align: center;
            font-size: 14px;
            line-height: 1.8;
        }

        .register-login a,
        .register-back {
            color: #2563EB;
            font-weight: 700;
            text-decoration: none;
        }

        .register-back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #475569;
            font-weight: 500;
        }

        .register-login a:hover,
        .register-back:hover {
            text-decoration: underline;
        }

        /* FOOTER */
        .register-footer {
            padding: 22px 12px;
            background: #0F172A;
            color: #E2E8F0;
            text-align: center;
            font-size: 13px;
            line-height: 1.7;
        }

        .register-footer p {
            margin: 4px 0;
        }

        /* MOBILE RESPONSIVENESS */
        @media (max-width: 600px) {
            body::before {
                background-size: 90vw auto;
                opacity: 0.07;
            }
        }

        @media (max-width: 480px) {
            .register-header {
                padding: 13px 10px;
            }

            .register-brand h1 {
                font-size: 20px;
            }

            .register-brand img {
                width: 45px;
                height: 45px;
            }

            .register-main {
                padding: 24px 13px;
            }

            .register-card {
                padding: 25px 20px;
                border-radius: 16px;
            }

            .register-card h2 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<div class="register-page">

    <header class="register-header">
        <div class="register-brand">

            <img src="logo.png" alt="MichaelVenture Logo">

            <div>
                <h1>MichaelVenture</h1>
                <p>Digital Services &amp; Business Support</p>
            </div>

        </div>
    </header>

    <main class="register-main">

        <section class="register-card">

            <img
                src="logo.png"
                alt="MichaelVenture Logo"
                class="register-logo"
            >

            <h2>Create Account</h2>

            <p class="register-description">
                Join MichaelVenture today and access our digital services.
            </p>

            <form id="registerForm" class="register-form">

                <div class="form-group">
                    <label for="fullName">Full Name</label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >
                </div>

                <button
                    type="submit"
                    id="registerButton"
                    class="register-submit"
                >
                    Create Account
                </button>

            </form>

            <p class="register-login">
                Already have an account?
                <a href="login.html">Login</a>
            </p>

            <a href="index.html" class="register-back">
                &larr; Back to Home
            </a>

        </section>

    </main>

    <footer class="register-footer">

        <p>
            &copy; <span id="currentYear"></span>
            <strong>MichaelVenture</strong>. All Rights Reserved.
        </p>

        <p>
            Professional Digital Services &amp; Business Support.
        </p>

    </footer>

</div>

<!-- SUPABASE CONNECTION -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const registerForm = document.getElementById("registerForm");
    const registerButton = document.getElementById("registerButton");

    document.getElementById("currentYear").textContent =
        new Date().getFullYear();

    registerForm.addEventListener("submit", async function (event) {

        event.preventDefault();

        const fullName =
            document.getElementById("fullName").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        if (!fullName || !email || !password) {
            alert("Please fill in all fields.");
            return;
        }

        if (password.length < 6) {
            alert("Your password must contain at least 6 characters.");
            return;
        }

        if (
            !window.SUPABASE_URL ||
            !window.SUPABASE_KEY ||
            !window.supabase
        ) {
            alert(
                "The registration service could not load. " +
                "Please refresh the page and try again."
            );
            return;
        }

        registerButton.disabled = true;
        registerButton.textContent = "Creating Account...";

        try {

            const client = window.supabase.createClient(
                window.SUPABASE_URL,
                window.SUPABASE_KEY
            );

            const { data, error } = await client.auth.signUp({

                email: email,

                password: password,

                options: {
                    data: {
                        full_name: fullName
                    }
                }

            });

            if (error) {
                throw error;
            }

            if (
                data.user &&
                data.user.identities &&
                data.user.identities.length === 0
            ) {

                alert(
                    "An account with this email may already exist. " +
                    "Please try logging in."
                );

                return;
            }

            if (data.session) {

                alert("Your account has been created successfully!");

                window.location.href = "dashboard.html";

            } else {

                alert(
                    "Registration submitted successfully. " +
                    "Please check your email for a confirmation link " +
                    "before logging in."
                );

                window.location.href = "login.html";

            }

        } catch (error) {

            console.error("Registration error:", error);

            alert(
                "Registration failed: " +
                (error.message || "Please try again.")
            );

        } finally {

            registerButton.disabled = false;
            registerButton.textContent = "Create Account";

        }

    });

});
</script>

</body>
</html>
