<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile - MichaelVenture</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        .header {
            background: #075c3f;
            color: white;
            text-align: center;
            padding: 45px 20px;
        }

        .logo {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: white;
            color: #075c3f;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            font-size: 42px;
            font-weight: bold;
        }

        .header h1 {
            margin-top: 25px;
            font-size: 38px;
        }

        .header p {
            margin-top: 10px;
            font-size: 18px;
        }

        .container {
            width: 92%;
            max-width: 650px;
            margin: 35px auto;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .card h2 {
            color: #075c3f;
            margin-bottom: 25px;
        }

        .info {
            background: #f5f7fb;
            padding: 18px;
            border-radius: 14px;
            margin-bottom: 16px;
        }

        .label {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 7px;
        }

        .value {
            font-size: 18px;
            font-weight: bold;
            word-break: break-word;
        }

        .active {
            display: inline-block;
            background: #e5f7ee;
            color: #075c3f;
            padding: 8px 15px;
            border-radius: 20px;
        }

        .btn {
            display: block;
            width: 100%;
            border: none;
            padding: 17px;
            border-radius: 12px;
            margin-top: 15px;
            font-size: 17px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
        }

        .dashboard {
            background: #075c3f;
            color: white;
        }

        .logout {
            background: #172033;
            color: white;
        }

        #loading {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
            font-size: 20px;
        }

        #error {
            display: none;
            background: #ffe8e8;
            color: #b00020;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            word-break: break-word;
        }

        footer {
            text-align: center;
            color: #6b7280;
            padding: 40px 20px;
        }

        footer strong {
            color: #075c3f;
        }

    </style>

</head>


<body>


    <div class="header">

        <div class="logo">
            MV
        </div>

        <h1>
            My Profile
        </h1>

        <p>
            Manage your MichaelVenture account
        </p>

    </div>


    <div class="container">

        <div id="loading">
            Loading your profile...
        </div>


        <div id="error"></div>


        <div id="profile" style="display:none;">

            <div class="card">

                <h2>
                    Account Information
                </h2>


                <div class="info">

                    <div class="label">
                        Full Name
                    </div>

                    <div class="value"
                         id="name">
                        —
                    </div>

                </div>


                <div class="info">

                    <div class="label">
                        Email Address
                    </div>

                    <div class="value"
                         id="email">
                        —
                    </div>

                </div>


                <div class="info">

                    <div class="label">
                        Account Status
                    </div>

                    <div class="value">

                        <span class="active">
                            Active
                        </span>

                    </div>

                </div>


                <div class="info">

                    <div class="label">
                        Account Created
                    </div>

                    <div class="value"
                         id="created">
                        —
                    </div>

                </div>


                <a href="dashboard.html"
                   class="btn dashboard">

                    ← Back to Dashboard

                </a>


                <button id="logout"
                        class="btn logout">

                    Logout

                </button>

            </div>

        </div>

    </div>


    <footer>

        © 2026
        <strong>MichaelVenture</strong>.
        All Rights Reserved.

    </footer>


<script>

async function startProfile() {

    try {

        /* Check Supabase */

        if (!window.supabase) {

            throw new Error(
                "Supabase library did not load."
            );

        }


        /* Create Supabase client */

        const client =
            window.supabase.createClient(
                window.SUPABASE_URL,
                window.SUPABASE_KEY
            );


        /* Get current session */

        const result =
            await client.auth.getSession();


        if (result.error) {

            throw result.error;

        }


        const session =
            result.data.session;


        /* User is not logged in */

        if (!session) {

            window.location.href =
                "login.html";

            return;

        }


        const user =
            session.user;


        /* Get user's name */

        const fullName =
            user.user_metadata &&
            user.user_metadata.full_name
                ? user.user_metadata.full_name
                : "MichaelVenture User";


        document.getElementById("name")
            .textContent = fullName;


        document.getElementById("email")
            .textContent =
                user.email || "Not available";


        /* Account creation date */

        if (user.created_at) {

            document.getElementById("created")
                .textContent =
                new Date(
                    user.created_at
                ).toLocaleDateString(
                    "en-NG",
                    {
                        year: "numeric",
                        month: "long",
                        day: "numeric"
                    }
                );

        }


        /* Hide loading */

        document.getElementById("loading")
            .style.display = "none";


        /* Show profile */

        document.getElementById("profile")
            .style.display = "block";


    } catch (error) {

        console.error(error);


        document.getElementById("loading")
            .style.display = "none";


        const errorBox =
            document.getElementById("error");


        errorBox.style.display = "block";


        errorBox.innerHTML =
            "<strong>Profile could not load.</strong><br><br>" +
            error.message;

    }

}


/* Logout */

document.getElementById("logout")
    .addEventListener(
        "click",
        async function () {

            try {

                const client =
                    window.supabase.createClient(
                        window.SUPABASE_URL,
                        window.SUPABASE_KEY
                    );


                await client.auth.signOut();


                window.location.href =
                    "login.html";


            } catch (error) {

                alert(
                    "Logout failed: " +
                    error.message
                );

            }

        }
    );


startProfile();

</script>


</body>

</html>
