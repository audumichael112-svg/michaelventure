<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Requests - MichaelVenture</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        .header {
            text-align: center;
            padding: 55px 20px 35px;
        }

        .logo {
            width: 92px;
            height: 92px;
            border-radius: 50%;
            background: #075c3f;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: bold;
            margin: 0 auto 25px;
        }

        h1 {
            color: #075c3f;
            font-size: 44px;
            margin-bottom: 15px;
        }

        .subtitle {
            color: #6b7485;
            font-size: 22px;
            line-height: 1.5;
        }

        .container {
            width: 92%;
            max-width: 700px;
            margin: 10px auto 50px;
        }

        .loading {
            text-align: center;
            color: #6b7485;
            font-size: 20px;
            padding: 50px 10px;
        }

        .empty {
            background: white;
            border-radius: 25px;
            padding: 40px 25px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.06);
        }

        .empty h2 {
            color: #075c3f;
            margin-bottom: 12px;
        }

        .request-card {
            background: white;
            border-radius: 25px;
            padding: 28px;
            margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.07);
        }

        .service-title {
            font-size: 28px;
            margin-bottom: 18px;
            color: #172033;
        }

        .status {
            display: inline-block;
            padding: 10px 18px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 17px;
            margin-bottom: 22px;
        }

        .pending {
            background: #fff1df;
            color: #b86500;
        }

        .processing {
            background: #e7f0ff;
            color: #1464d2;
        }

        .completed {
            background: #e2f7ed;
            color: #087346;
        }

        .cancelled {
            background: #ffe7e7;
            color: #c62828;
        }

        .info {
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 8px;
        }

        .info strong {
            color: #172033;
        }

        .details {
            background: #f5f7fb;
            border-radius: 18px;
            padding: 20px;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .details-title {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .payment-box {
            background: #eefaf6;
            border-radius: 20px;
            padding: 22px;
            margin-top: 20px;
        }

        .payment-title {
            color: #075c3f;
            font-size: 23px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        .payment-row {
            padding: 12px 0;
            border-bottom: 1px solid #d7ebe4;
            font-size: 18px;
        }

        .payment-row:last-child {
            border-bottom: none;
        }

        .paid {
            color: #087346;
            font-weight: bold;
        }

        .unpaid {
            color: #b86500;
            font-weight: bold;
        }

        .submitted {
            color: #6b7485;
            font-size: 16px;
            margin-top: 20px;
        }

        .back {
            display: block;
            text-align: center;
            color: #075c3f;
            font-weight: bold;
            font-size: 20px;
            text-decoration: none;
            margin: 35px 0 70px;
        }

        footer {
            text-align: center;
            padding: 35px 15px;
            color: #6b7485;
            font-size: 17px;
        }

        footer strong {
            color: #075c3f;
        }

        @media (max-width: 500px) {
            h1 {
                font-size: 38px;
            }

            .subtitle {
                font-size: 19px;
            }

            .request-card {
                padding: 22px;
            }

            .service-title {
                font-size: 25px;
            }

            .info {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <div class="header">

        <div class="logo">MV</div>

        <h1>My Requests</h1>

        <p class="subtitle">
            Track the services you have requested.
        </p>

    </div>

    <div class="container">

        <div id="requestsContainer">
            <div class="loading">
                Loading your requests...
            </div>
        </div>

        <a href="dashboard.html" class="back">
            ← Back to Dashboard
        </a>

    </div>

    <footer>
        © 2026 <strong>MichaelVenture</strong>. All Rights Reserved.
    </footer>


<script>

    const client = window.supabase.createClient(
        window.SUPABASE_URL,
        window.SUPABASE_KEY
    );


    function escapeHTML(value) {

        if (value === null || value === undefined) {
            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    function getStatusClass(status) {

        const value = String(status || "").toLowerCase();

        if (value === "processing") return "processing";
        if (value === "completed") return "completed";
        if (value === "cancelled") return "cancelled";

        return "pending";
    }


    function getPaymentClass(status) {

        const value = String(status || "").toLowerCase();

        if (value === "paid") {
            return "paid";
        }

        return "unpaid";
    }


    function formatAmount(amount) {

        if (
            amount === null ||
            amount === undefined ||
            amount === ""
        ) {
            return "Not set";
        }

        const number = Number(amount);

        if (Number.isNaN(number)) {
            return escapeHTML(amount);
        }

        return "₦" + number.toLocaleString("en-NG");
    }


    function formatDate(date) {

        if (!date) {
            return "Not available";
        }

        return new Date(date).toLocaleString();
    }


    async function loadRequests() {

        const container =
            document.getElementById("requestsContainer");

        try {

            const {
                data: { session },
                error: sessionError
            } = await client.auth.getSession();


            if (sessionError || !session) {

                window.location.href = "login.html";
                return;
            }


            const { data, error } = await client
                .from("service_requests")
                .select("*")
                .eq("user_id", session.user.id)
                .order("created_at", {
                    ascending: false
                });


            if (error) {

                console.error(error);

                container.innerHTML = `
                    <div class="empty">
                        <h2>Unable to load requests</h2>
                        <p>Please refresh the page and try again.</p>
                    </div>
                `;

                return;
            }


            if (!data || data.length === 0) {

                container.innerHTML = `
                    <div class="empty">
                        <h2>No Requests Yet</h2>
                        <p>
                            You have not submitted any service request yet.
                        </p>
                    </div>
                `;

                return;
            }


            container.innerHTML = data.map(request => {

                const status =
                    request.status || "Pending";

                const paymentStatus =
                    request.payment_status || "Unpaid";


                return `

                    <div class="request-card">

                        <div class="service-title">
                            ${escapeHTML(request.service_name)}
                        </div>


                        <div class="status ${getStatusClass(status)}">
                            🔵 ${escapeHTML(status)}
                        </div>


                        <div class="info">
                            <strong>Name:</strong>
                            ${escapeHTML(request.full_name)}
                        </div>


                        <div class="info">
                            <strong>Phone:</strong>
                            ${escapeHTML(request.phone)}
                        </div>


                        ${
                            request.jamb_number
                            ?
                            `
                            <div class="info">
                                <strong>
                                    JAMB Reg. / Matric / Business Email:
                                </strong><br>
                                ${escapeHTML(request.jamb_number)}
                            </div>
                            `
                            :
                            ""
                        }


                        ${
                            request.details
                            ?
                            `
                            <div class="details">

                                <div class="details-title">
                                    Additional Information:
                                </div>

                                <div>
                                    ${escapeHTML(request.details)}
                                </div>

                            </div>
                            `
                            :
                            ""
                        }


                        <div class="payment-box">

                            <div class="payment-title">
                                💳 Payment Information
                            </div>


                            <div class="payment-row">

                                <strong>
                                    Service Amount
                                </strong>

                                <br>

                                ${formatAmount(request.service_amount)}

                            </div>


                            <div class="payment-row">

                                <strong>
                                    Payment Status
                                </strong>

                                <br>

                                <span class="${getPaymentClass(paymentStatus)}">
                                    ${escapeHTML(paymentStatus)}
                                </span>

                            </div>


                            <div class="payment-row">

                                <strong>
                                    Payment Reference
                                </strong>

                                <br>

                                ${
                                    request.payment_reference
                                    ?
                                    escapeHTML(request.payment_reference)
                                    :
                                    "Not available"
                                }

                            </div>

                        </div>


                        <div class="submitted">

                            Submitted:
                            ${formatDate(request.created_at)}

                        </div>

                    </div>

                `;

            }).join("");


        } catch (error) {

            console.error(error);

            container.innerHTML = `
                <div class="empty">

                    <h2>Something went wrong</h2>

                    <p>
                        Please refresh the page and try again.
                    </p>

                </div>
            `;
        }
    }


    loadRequests();

</script>

</body>
</html>
