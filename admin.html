<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - MichaelVenture</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        .header {
            background: #075c3f;
            color: white;
            text-align: center;
            padding: 28px 20px;
        }

        .logo {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: white;
            color: #075c3f;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: bold;
            margin: 0 auto 15px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 16px;
            opacity: .9;
        }

        .container {
            width: 92%;
            max-width: 900px;
            margin: 25px auto 60px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 35px;
        }

        .stat-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,.07);
        }

        .stat-card span {
            display: block;
            color: #687386;
            font-size: 17px;
            margin-bottom: 12px;
        }

        .stat-card strong {
            font-size: 40px;
        }

        .section-title {
            font-size: 30px;
            margin-bottom: 20px;
        }

        .message {
            background: white;
            padding: 30px;
            border-radius: 18px;
            text-align: center;
            color: #687386;
            margin-bottom: 25px;
        }

        .request-card {
            background: white;
            border-radius: 22px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 30px rgba(0,0,0,.08);
        }

        .request-card h2 {
            font-size: 24px;
            margin-bottom: 15px;
        }

        .status {
            display: inline-block;
            padding: 9px 16px;
            border-radius: 30px;
            background: #eaf2ff;
            color: #1769d2;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .info {
            margin: 10px 0;
            line-height: 1.6;
        }

        .info strong {
            color: #172033;
        }

        .details {
            background: #f5f7fb;
            border-radius: 15px;
            padding: 18px;
            margin: 20px 0;
            line-height: 1.6;
        }

        .manage {
            border-top: 1px solid #e2e5ea;
            margin-top: 22px;
            padding-top: 22px;
        }

        .manage h3 {
            margin-bottom: 15px;
            font-size: 22px;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 15px 0 7px;
        }

        input,
        select {
            width: 100%;
            padding: 15px;
            border: 1px solid #ccd2da;
            border-radius: 12px;
            font-size: 16px;
            background: white;
        }

        .update-btn {
            width: 100%;
            margin-top: 20px;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: #075c3f;
            color: white;
            font-size: 17px;
            font-weight: bold;
        }

        .update-btn:disabled {
            opacity: .6;
        }

        .logout {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: #172033;
            color: white;
            font-size: 17px;
            font-weight: bold;
            margin-top: 15px;
        }

        .footer {
            text-align: center;
            color: #687386;
            padding: 30px 15px;
        }

        @media (max-width: 650px) {
            .stats {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 24px;
            }

            .section-title {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <div class="logo">MV</div>

        <h1>MichaelVenture Admin</h1>

        <p>Manage customer requests and payments</p>
    </header>

    <main class="container">

        <section class="stats">

            <div class="stat-card">
                <span>Total Requests</span>
                <strong id="totalRequests">0</strong>
            </div>

            <div class="stat-card">
                <span>Pending</span>
                <strong id="pendingRequests">0</strong>
            </div>

            <div class="stat-card">
                <span>Completed</span>
                <strong id="completedRequests">0</strong>
            </div>

        </section>

        <h2 class="section-title">Customer Requests</h2>

        <div id="message" class="message">
            Loading requests...
        </div>

        <div id="requestsContainer"></div>

        <button class="logout" onclick="logout()">
            Logout
        </button>

    </main>

    <footer class="footer">
        © 2026 <strong>MichaelVenture</strong>. All Rights Reserved.
    </footer>


<script>

const client = window.supabase.createClient(
    window.SUPABASE_URL,
    window.SUPABASE_KEY
);


/* =========================
   CHECK ADMIN
========================= */

async function checkAdmin() {

    const {
        data: { session },
        error
    } = await client.auth.getSession();

    if (error || !session) {
        window.location.href = "admin-login.html";
        return false;
    }

    const { data, error: adminError } = await client
        .from("admin_users")
        .select("user_id")
        .eq("user_id", session.user.id)
        .maybeSingle();

    if (adminError) {

        console.error("Admin check error:", adminError);

        alert("Unable to verify administrator access.");

        window.location.href = "admin-login.html";

        return false;
    }

    if (!data) {

        alert("You do not have administrator access.");

        await client.auth.signOut();

        window.location.href = "admin-login.html";

        return false;
    }

    return true;
}


/* =========================
   LOAD REQUESTS
========================= */

async function loadRequests() {

    const message = document.getElementById("message");
    const container = document.getElementById("requestsContainer");

    message.style.display = "block";
    message.textContent = "Loading requests...";

    const {
        data: requests,
        error
    } = await client
        .from("service_requests")
        .select("*")
        .order("created_at", {
            ascending: false
        });

    console.log("REQUEST DATA:", requests);
    console.log("REQUEST ERROR:", error);

    if (error) {

        console.error(error);

        message.textContent =
            "Unable to load requests: " + error.message;

        return;
    }

    document.getElementById("totalRequests").textContent =
        requests.length;

    const pending = requests.filter(
        r => String(r.status || "").toLowerCase() === "pending"
    ).length;

    const completed = requests.filter(
        r => String(r.status || "").toLowerCase() === "completed"
    ).length;

    document.getElementById("pendingRequests").textContent =
        pending;

    document.getElementById("completedRequests").textContent =
        completed;


    if (!requests.length) {

        message.textContent = "No customer requests yet.";

        container.innerHTML = "";

        return;
    }


    message.style.display = "none";

    container.innerHTML = "";


    requests.forEach(request => {

        const card = document.createElement("div");

        card.className = "request-card";


        const status =
            request.status || "Pending";

        const amount =
            request.service_amount ?? "";

        const paymentStatus =
            request.payment_status || "Unpaid";

        const paymentReference =
            request.payment_reference || "";


        card.innerHTML = `

            <h2>
                ${escapeHTML(request.service_name || "Service Request")}
            </h2>

            <div class="status">
                ${escapeHTML(status)}
            </div>

            <div class="info">
                <strong>Customer:</strong>
                ${escapeHTML(request.full_name || "")}
            </div>

            <div class="info">
                <strong>Phone:</strong>
                ${escapeHTML(request.phone || "")}
            </div>

            <div class="info">
                <strong>JAMB / Matric / Business Email:</strong>
                ${escapeHTML(request.jamb_number || "")}
            </div>

            <div class="info">
                <strong>Submitted:</strong>
                ${request.created_at
                    ? new Date(request.created_at).toLocaleString()
                    : ""
                }
            </div>

            <div class="details">

                <strong>Additional Information:</strong>

                <p style="margin-top:10px;">
                    ${escapeHTML(request.details || "No additional information")}
                </p>

            </div>


            <div class="manage">

                <h3>Manage Request</h3>


                <label>
                    Service Status
                </label>

                <select id="status-${request.id}">

                    <option value="Pending"
                        ${status === "Pending" ? "selected" : ""}>
                        Pending
                    </option>

                    <option value="Processing"
                        ${status === "Processing" ? "selected" : ""}>
                        Processing
                    </option>

                    <option value="Completed"
                        ${status === "Completed" ? "selected" : ""}>
                        Completed
                    </option>

                    <option value="Cancelled"
                        ${status === "Cancelled" ? "selected" : ""}>
                        Cancelled
                    </option>

                </select>


                <label>
                    Service Amount (₦)
                </label>

                <input
                    type="number"
                    id="amount-${request.id}"
                    value="${escapeHTML(String(amount))}"
                    placeholder="Enter amount"
                >


                <label>
                    Payment Status
                </label>

                <select id="payment-${request.id}">

                    <option value="Unpaid"
                        ${paymentStatus === "Unpaid" ? "selected" : ""}>
                        Unpaid
                    </option>

                    <option value="Pending"
                        ${paymentStatus === "Pending" ? "selected" : ""}>
                        Payment Pending
                    </option>

                    <option value="Paid"
                        ${paymentStatus === "Paid" ? "selected" : ""}>
                        Paid
                    </option>

                    <option value="Refunded"
                        ${paymentStatus === "Refunded" ? "selected" : ""}>
                        Refunded
                    </option>

                </select>


                <label>
                    Payment Reference
                </label>

                <input
                    type="text"
                    id="reference-${request.id}"
                    value="${escapeHTML(String(paymentReference))}"
                    placeholder="Enter payment reference"
                >


                <button
                    class="update-btn"
                    onclick="updateRequest('${request.id}')">

                    Update Request

                </button>

            </div>
        `;


        container.appendChild(card);

    });

}


/* =========================
   UPDATE REQUEST
========================= */

async function updateRequest(id) {

    const status =
        document.getElementById("status-" + id).value;

    const amount =
        document.getElementById("amount-" + id).value;

    const paymentStatus =
        document.getElementById("payment-" + id).value;

    const paymentReference =
        document.getElementById("reference-" + id).value;


    const button =
        document.querySelector(
            `button[onclick="updateRequest('${id}')"]`
        );


    button.disabled = true;

    button.textContent = "Updating...";


    const { error } = await client
        .from("service_requests")
        .update({

            status: status,

            service_amount:
                amount === "" ? null : Number(amount),

            payment_status:
                paymentStatus,

            payment_reference:
                paymentReference || null

        })
        .eq("id", id);


    if (error) {

        console.error(error);

        alert(
            "Update failed:\n\n" +
            error.message
        );

        button.disabled = false;

        button.textContent = "Update Request";

        return;
    }


    alert("Request updated successfully! ✅");

    await loadRequests();

}


/* =========================
   LOGOUT
========================= */

async function logout() {

    await client.auth.signOut();

    window.location.href =
        "admin-login.html";
}


/* =========================
   HTML SECURITY
========================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================
   START
========================= */

(async function () {

    const allowed = await checkAdmin();

    if (allowed) {

        await loadRequests();

    }

})();

</script>

</body>
</html>
