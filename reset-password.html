<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - MichaelVenture</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f2f7f5;
            font-family: Arial, sans-serif;
        }

        .reset-card {
            background: white;
            width: 100%;
            max-width: 430px;
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #075c3e;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 18px 0 8px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 22px;
            background: #075c3e;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #075c3e;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="reset-card">

    <h1>MichaelVenture</h1>

    <p class="subtitle">
        Create a new password for your account.
    </p>

    <form id="resetForm">

        <label for="newPassword">New Password</label>

        <input
            type="password"
            id="newPassword"
            placeholder="Enter your new password"
            minlength="8"
            autocomplete="new-password"
            required
        >

        <label for="confirmPassword">Confirm New Password</label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Enter your password again"
            minlength="8"
            autocomplete="new-password"
            required
        >

        <button type="submit" id="saveButton" disabled>
            Update Password
        </button>

    </form>

    <p id="message" role="status">
        Checking your recovery link...
    </p>

    <a class="back-link" href="login.html">
        Back to Login
    </a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>
const client = window.supabase.createClient(
    window.SUPABASE_URL,
    window.SUPABASE_KEY
);

const resetForm = document.getElementById("resetForm");
const message = document.getElementById("message");
const saveButton = document.getElementById("saveButton");

let recoveryReady = false;

async function checkRecoverySession() {

    try {
        // Handle a recovery link that returns tokens in the URL hash.
        const hash = new URLSearchParams(
            window.location.hash.substring(1)
        );

        const accessToken = hash.get("access_token");
        const refreshToken = hash.get("refresh_token");
        const authError = hash.get("error_description");

        if (authError) {
            throw new Error(authError);
        }

        if (accessToken && refreshToken) {
            const { error } = await client.auth.setSession({
                access_token: accessToken,
                refresh_token: refreshToken
            });

            if (error) throw error;

            // Remove tokens from the visible browser address.
            window.history.replaceState(
                null,
                document.title,
                window.location.pathname
            );
        }

        const { data, error } = await client.auth.getSession();

        if (error) throw error;

        if (!data.session) {
            throw new Error(
                "Your password reset link is invalid or expired. Please request another one."
            );
        }

        recoveryReady = true;
        saveButton.disabled = false;

        message.style.color = "#075c3e";
        message.textContent =
            "Recovery verified. Enter your new password.";

    } catch (error) {

        recoveryReady = false;
        saveButton.disabled = true;

        message.style.color = "red";
        message.textContent = error.message;
    }
}

resetForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    if (!recoveryReady) {
        message.style.color = "red";
        message.textContent =
            "Your recovery session is not valid. Request a new reset link.";
        return;
    }

    const password =
        document.getElementById("newPassword").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    if (password.length < 8) {
        message.style.color = "red";
        message.textContent =
            "Your password must contain at least 8 characters.";
        return;
    }

    if (password !== confirmPassword) {
        message.style.color = "red";
        message.textContent =
            "The passwords do not match.";
        return;
    }

    saveButton.disabled = true;
    saveButton.textContent = "Updating...";
    message.textContent = "";

    try {

        const { error } = await client.auth.updateUser({
            password: password
        });

        if (error) throw error;

        // Confirm the update succeeded before showing success.
        message.style.color = "green";
        message.textContent =
            "Password updated successfully! Please log in with your new password.";

        recoveryReady = false;
        resetForm.reset();

        // End the recovery session after successful update.
        await client.auth.signOut();

        saveButton.textContent = "Password Updated";

    } catch (error) {

        message.style.color = "red";
        message.textContent = error.message;

        saveButton.disabled = false;
        saveButton.textContent = "Update Password";
    }
});

checkRecoverySession();
</script>

</body>
</html>
