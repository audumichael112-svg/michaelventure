<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFFFFF">

<title>My Profile | MichaelVenture</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #F3F4F6;
    color: #1E293B;
    min-height: 100vh;
    line-height: 1.6;
}

/* MICHAELVENTURE WATERMARK */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: url("logo.png");
    background-repeat: no-repeat;
    background-position: center;
    background-size: min(85vw, 500px);
    opacity: 0.045;
    pointer-events: none;
    z-index: 0;
}

.header,
.container,
footer {
    position: relative;
    z-index: 1;
}

.header {
    background: #FFFFFF;
    color: #1E293B;
    text-align: center;
    padding: 35px 18px;
    border-bottom: 1px solid #E5E7EB;
}

.logo {
    width: 95px;
    height: 95px;
    object-fit: contain;
    background: #FFFFFF;
    border: 1px solid #E5E7EB;
    border-radius: 20px;
    padding: 6px;
    margin-bottom: 12px;
}

.header h1 {
    font-size: 29px;
    margin-bottom: 8px;
}

.header p {
    color: #64748B;
    font-size: 15px;
}

.container {
    width: 92%;
    max-width: 650px;
    margin: 35px auto;
}

.card {
    background: rgba(255, 255, 255, 0.97);
    border: 1px solid #E5E7EB;
    border-radius: 18px;
    padding: 28px;
    box-shadow: 0 8px 30px rgba(15, 23, 42, 0.06);
}

.card h2 {
    color: #1E293B;
    margin-bottom: 8px;
    font-size: 24px;
}

.subtitle {
    color: #64748B;
    font-size: 14px;
    margin-bottom: 25px;
}

.info {
    background: #F8FAFC;
    border: 1px solid #E5E7EB;
    padding: 16px;
    border-radius: 12px;
    margin-bottom: 17px;
}

.label {
    color: #64748B;
    font-size: 13px;
    margin-bottom: 6px;
    display: block;
    font-weight: bold;
}

.value {
    font-size: 16px;
    font-weight: bold;
    overflow-wrap: anywhere;
}

.status {
    display: inline-block;
    background: #DBEAFE;
    color: #1D4ED8;
    padding: 6px 13px;
    border-radius: 20px;
    font-size: 13px;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 8px;
    color: #374151;
}

.form-group input {
    width: 100%;
    padding: 14px;
    border: 1px solid #D1D5DB;
    border-radius: 10px;
    background: #FFFFFF;
    color: #1E293B;
    font-size: 15px;
    outline: none;
}

.form-group input:focus {
    border-color: #2563EB;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
}

.form-group input[readonly] {
    background: #F3F4F6;
    color: #64748B;
}

.btn {
    display: block;
    width: 100%;
    border: none;
    padding: 14px;
    border-radius: 10px;
    margin-top: 14px;
    font-size: 15px;
    font-weight: bold;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
}

.btn:disabled {
    opacity: 0.65;
    cursor: not-allowed;
}

.save-btn {
    background: #2563EB;
    color: #FFFFFF;
}

.save-btn:hover {
    background: #1D4ED8;
}

.dashboard-btn {
    background: #FFFFFF;
    color: #1D4ED8;
    border: 1px solid #BFDBFE;
}

.logout-btn {
    background: #E5E7EB;
    color: #374151;
}

.message {
    display: none;
    padding: 12px;
    margin-bottom: 18px;
    border-radius: 9px;
    font-size: 14px;
    overflow-wrap: anywhere;
}

.message.success {
    display: block;
    background: #DBEAFE;
    color: #1D4ED8;
}

.message.error {
    display: block;
    background: #FEE2E2;
    color: #991B1B;
}

#loading {
    text-align: center;
    padding: 50px 15px;
    color: #64748B;
    font-size: 17px;
}

footer {
    text-align: center;
    color: #64748B;
    padding: 30px 15px;
    font-size: 13px;
}

footer strong {
    color: #1E293B;
}

@media (max-width: 600px) {
    .header {
        padding: 28px 15px;
    }

    .header h1 {
        font-size: 25px;
    }

    .container {
        margin: 25px auto;
    }

    .card {
        padding: 22px 18px;
    }
}
</style>
</head>

<body>

<header class="header">

    <img src="logo.png"
         alt="MichaelVenture Logo"
         class="logo">

    <h1>My Profile</h1>

    <p>Manage your MichaelVenture account</p>

</header>

<main class="container">

    <div id="loading">
        Loading your profile...
    </div>

    <div id="profile" style="display:none;">

        <div class="card">

            <h2>Account Information</h2>

            <p class="subtitle">
                Update your personal information below.
            </p>

            <div id="message" class="message" role="alert"></div>

            <form id="profileForm">

                <div class="form-group">

                    <label for="fullName">Full Name</label>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        maxlength="100"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="phone">Phone Number</label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                        autocomplete="tel"
                        maxlength="25"
                    >

                </div>

                <div class="info">

                    <span class="label">Email Address</span>

                    <div class="value" id="email">—</div>

                    <small style="color:#64748B;">
                        Your registered email is displayed here.
                    </small>

                </div>

                <div class="info">

                    <span class="label">Account Status</span>

                    <span class="status">Active</span>

                </div>

                <div class="info">

                    <span class="label">Account Created</span>

                    <div class="value" id="created">—</div>

                </div>

                <button
                    type="submit"
                    class="btn save-btn"
                    id="saveBtn"
                >
                    Save Changes
                </button>

            </form>

            <a href="dashboard.html" class="btn dashboard-btn">
                ← Back to Dashboard
            </a>

            <button id="logout" class="btn logout-btn">
                Logout
            </button>

        </div>

    </div>

</main>

<footer>
    © <span id="year"></span>
    <strong>MichaelVenture</strong>. All Rights Reserved.
</footer>

<script>
document.getElementById("year").textContent =
    new Date().getFullYear();

let client = null;
let currentUser = null;

const loading = document.getElementById("loading");
const profile = document.getElementById("profile");
const messageBox = document.getElementById("message");
const saveBtn = document.getElementById("saveBtn");
const profileForm = document.getElementById("profileForm");

function showMessage(text, type) {
    messageBox.textContent = text;
    messageBox.className = "message " + type;
}

function createClient() {
    if (!window.supabase) {
        throw new Error(
            "Supabase did not load. Please check your internet connection."
        );
    }

    if (!window.SUPABASE_URL || !window.SUPABASE_KEY) {
        throw new Error(
            "Supabase settings are missing from supabase.js."
        );
    }

    if (!client) {
        client = window.supabase.createClient(
            window.SUPABASE_URL,
            window.SUPABASE_KEY
        );
    }

    return client;
}

async function startProfile() {
    try {
        const supabaseClient = createClient();

        const { data, error } =
            await supabaseClient.auth.getSession();

        if (error) {
            throw error;
        }

        if (!data.session) {
            window.location.href = "login.html";
            return;
        }

        currentUser = data.session.user;

        const metadata = currentUser.user_metadata || {};

        document.getElementById("fullName").value =
            metadata.full_name || "";

        document.getElementById("phone").value =
            metadata.phone || "";

        document.getElementById("email").textContent =
            currentUser.email || "Not available";

        if (currentUser.created_at) {
            document.getElementById("created").textContent =
                new Date(currentUser.created_at).toLocaleDateString(
                    "en-NG",
                    {
                        year: "numeric",
                        month: "long",
                        day: "numeric"
                    }
                );
        }

        loading.style.display = "none";
        profile.style.display = "block";

    } catch (error) {
        console.error(error);

        loading.textContent =
            "Profile could not load: " + error.message;
    }
}

profileForm.addEventListener("submit", async function(event) {
    event.preventDefault();

    if (!currentUser) {
        showMessage(
            "Your session has expired. Please log in again.",
            "error"
        );
        return;
    }

    const fullName =
        document.getElementById("fullName").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    if (!fullName) {
        showMessage("Please enter your full name.", "error");
        return;
    }

    saveBtn.disabled = true;
    saveBtn.textContent = "Saving Changes...";

    try {
        const { data, error } = await client.auth.updateUser({
            data: {
                full_name: fullName,
                phone: phone
            }
        });

        if (error) {
            throw error;
        }

        currentUser = data.user;

        showMessage(
            "Your profile has been updated successfully!",
            "success"
        );

    } catch (error) {
        console.error(error);

        showMessage(
            "Could not save your profile: " + error.message,
            "error"
        );

    } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = "Save Changes";
    }
});

document.getElementById("logout").addEventListener(
    "click",
    async function() {

        const button = this;

        button.disabled = true;
        button.textContent = "Logging out...";

        try {
            const supabaseClient = createClient();

            const { error } =
                await supabaseClient.auth.signOut();

            if (error) {
                throw error;
            }

            window.location.href = "login.html";

        } catch (error) {
            showMessage(
                "Logout failed: " + error.message,
                "error"
            );

            button.disabled = false;
            button.textContent = "Logout";
        }
    }
);

startProfile();
</script>

</body>
</html>
